name: Deploy to Cloudflare Pages

# Manual only until the Cloudflare Pages project and CLOUDFLARE_API_TOKEN secret exist.
# Restore the push trigger at launch.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2ae1c50880dd703e1cd38c3623689cef
          command: pages deploy _site --project-name=premierdriverimprovement
